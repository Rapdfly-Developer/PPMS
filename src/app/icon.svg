<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PPMS">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22A79A"/>
      <stop offset="0.55" stop-color="#157A73"/>
      <stop offset="1" stop-color="#0D4A46"/>
    </linearGradient>
  </defs>

  <!-- Brand tile: carries its own background so the mark stays legible on
       both light and dark browser tab bars. Gradient matches the sidebar logo. -->
  <rect width="64" height="64" rx="14" fill="url(#tile)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.18"/>

  <!-- Medical cross, two overlapping rounded bars: rounded outer corners,
       crisp inner notches. Sized to stay readable down to 16px. -->
  <g fill="#ffffff">
    <rect x="23" y="13" width="18" height="38" rx="4"/>
    <rect x="13" y="23" width="38" height="18" rx="4"/>
  </g>
</svg>
